name: Build DreamLauncher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build DreamLauncher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: Launcher
        run: chmod +x gradlew

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/dreamlauncher.jks" \
            -alias dreamlauncher \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dreamlauncher \
            -keypass dreamlauncher \
            -dname "CN=DreamLauncher, OU=DreamLauncher, O=DreamLauncher, L=Unknown, ST=Unknown, C=US"

      - name: Build release APK
        working-directory: Launcher
        run: ./gradlew :App:assembleRelease

      - name: Find APK
        id: apk
        working-directory: Launcher
        run: |
          APK=$(find App/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK was found!"
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        env:
          KEYSTORE: ${{ runner.temp }}/dreamlauncher.jks
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:dreamlauncher \
            --ks-key-alias dreamlauncher \
            --key-pass pass:dreamlauncher \
            --out "$GITHUB_WORKSPACE/DreamLauncher.apk" \
            "Launcher/${{ steps.apk.outputs.apk }}"

      - name: Verify APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose DreamLauncher.apk

      - name: Upload DreamLauncher.apk
        uses: actions/upload-artifact@v4
        with:
          name: DreamLauncher
          path: DreamLauncher.apk