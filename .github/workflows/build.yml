name: Build DreamLauncher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        working-directory: Launcher
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: Launcher
        run: ./gradlew :App:assembleRelease

      - name: Rename APK
        working-directory: Launcher
        run: |
          APK=$(find App/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK was found!"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/DreamLauncher.apk"

      - name: Upload DreamLauncher.apk
        uses: actions/upload-artifact@v4
        with:
          name: DreamLauncher
          path: DreamLauncher.apk